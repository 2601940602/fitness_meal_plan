<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🛒 采购清单 - 健身腹肌餐计划</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #e8e8e8;
    padding-bottom: 80px;
  }
  .header {
    padding: 24px 20px 16px;
    text-align: center;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, #00d4aa, #00a8e8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .header .sub { font-size: 12px; color: #8892b0; }
  .content { padding: 16px; }

  /* 采购分组卡片 */
  .shop-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 18px 16px;
    margin-bottom: 14px;
  }
  .shop-card h3 {
    font-size: 15px;
    font-weight: 700;
    color: #00d4aa;
    margin-bottom: 12px;
  }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .check-item:last-child { border-bottom: none; }
  .check-item input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: #00d4aa;
    flex-shrink: 0;
  }
  .check-item label {
    font-size: 14px;
    flex: 0 1 auto;
    min-width: 0;
    color: #e8e8e8;
    line-height: 1.5;
  }
  .check-item .qty {
    font-size: 12px;
    color: #8892b0;
    flex: 1 1 0;
    min-width: 0;
    text-align: left;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .highlight-protein {
    color: #ff9f43;
    font-weight: 600;
    background: rgba(255,159,67,0.08);
    padding: 1px 6px;
    border-radius: 6px;
  }

  /* 底部导航 */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(26,26,46,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 12px 16px;
    display: flex;
    justify-content: space-around;
    z-index: 100;
  }
  .bottom-btn {
    font-size: 12px;
    color: #8892b0;
    text-align: center;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 10px;
    transition: all 0.2s;
    user-select: none;
    text-decoration: none;
  }
  .bottom-btn.active {
    color: #00d4aa;
    background: rgba(0,212,170,0.1);
  }
</style>
</head>
<body>

<div x-data="shopPage">

  <div class="header">
    <h1>🛒 一周采购清单</h1>
    <div class="sub">勾选状态会自动保存</div>
  </div>

  <div class="content">
    <template x-for="section in shopList" :key="section.title">
      <div class="shop-card">
        <h3 x-text="section.title"></h3>
        <template x-for="(item, idx) in section.items" :key="section.title + idx">
          <div class="check-item">
            <input type="checkbox" :id="'shop_' + section.key + idx" x-model="item.checked"
                   @change="saveShopState()">
            <label :for="'shop_' + section.key + idx" x-html="item.name"></label>
            <span class="qty" x-html="item.qty"></span>
          </div>
        </template>
      </div>
    </template>
  </div>

  <div class="bottom-bar">
    <a class="bottom-btn" href="index.html">📋 餐单</a>
    <a class="bottom-btn active" href="shop.html">🛒 采购</a>
    <a class="bottom-btn" href="tips.html">💡 贴士</a>
  </div>

</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('shopPage', () => ({
    shopList: [
      {
        key: 'meat', title: '🥩 肉类/蛋白（周末批量备餐）',
        items: [
          { name: '<span class="highlight-protein">板腱牛排</span>（生）', qty: '库存 7 块共 1131g，用到周日；<strong>周六补货</strong>（117g 切剩的 52g 记得先冷冻）', checked: false },
          { name: '蛋白选择建议', qty: '当前餐单默认按板腱牛排计算，想换去皮鸡腿就把对应 foodKey 改成 chickenThighRaw', checked: false },
          { name: '鸡蛋', qty: '14 个', checked: false },
          { name: '蛋白粉', qty: '每周约 14 勺（午餐+晚餐各1勺）', checked: false },
        ],
      },
      {
        key: 'carb', title: '🍞 碳水/主食',
        items: [
          { name: '红薯', qty: '约2.6kg', checked: false },
          { name: '土豆', qty: '约2.6kg', checked: false },
          { name: '玉米（真空包装或冷冻）', qty: '7 根（约1.4kg）', checked: false },
          { name: '香蕉', qty: '4 根', checked: false },
        ],
      },
      {
        key: 'dairy', title: '🥛 奶/饮品',
        items: [
          { name: '高蛋白低脂奶', qty: '4L（1L×4 盒）', checked: false },
        ],
      },
      {
        key: 'veg', title: '🥬 蔬菜/脂肪/调料',
        items: [
          { name: '黄瓜', qty: '1.5kg', checked: false },
          { name: '<span class="highlight-protein">巴旦木（杏仁）</span>', qty: '约 150g 小袋装', checked: false },
          { name: '山茶油', qty: '现有', checked: false },
          { name: '食用盐', qty: '现有', checked: false },
          { name: '黑胡椒', qty: '1 小瓶', checked: false },
        ],
      },
    ],

    init() {
      this.shopList.forEach(section => {
        section.items.forEach((item, idx) => {
          const key = 'shop_' + section.key + idx;
          try { item.checked = localStorage.getItem(key) === 'true'; } catch (e) {}
        });
      });
    },

    saveShopState() {
      this.shopList.forEach(section => {
        section.items.forEach((item, idx) => {
          const key = 'shop_' + section.key + idx;
          try { localStorage.setItem(key, item.checked); } catch (e) {}
        });
      });
    },
  }));
});
</script>

</body>
</html>
