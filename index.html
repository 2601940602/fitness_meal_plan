<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健身腹肌餐计划</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #e8e8e8;
    padding-bottom: 80px;
  }
  .header {
    padding: 24px 20px 16px;
    text-align: center;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, #00d4aa, #00a8e8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .header .sub { font-size: 12px; color: #8892b0; }
  .stats-bar {
    display: flex;
    justify-content: space-around;
    padding: 16px 12px;
    gap: 8px;
  }
  .stat-card {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .stat-card .num { font-size: 20px; font-weight: 700; color: #00d4aa; }
  .stat-card .label { font-size: 11px; color: #8892b0; margin-top: 2px; }
  .tabs {
    display: flex;
    overflow-x: auto;
    padding: 0 16px;
    gap: 8px;
    margin-top: 8px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #8892b0;
    user-select: none;
  }
  .tab.active {
    background: linear-gradient(135deg, #00d4aa, #00a8e8);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(0,212,170,0.3);
  }
  .content { padding: 16px; }
  .day-card {
    background: rgba(255,255,255,0.04);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .day-title { font-size: 18px; font-weight: 700; }
  .day-tag {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 10px;
    font-weight: 600;
  }
  .tag-high { background: rgba(0,212,170,0.15); color: #00d4aa; }
  .tag-mid { background: rgba(0,168,232,0.15); color: #00a8e8; }
  .tag-low { background: rgba(233,69,96,0.15); color: #e94560; }
  .day-stats {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap;
  }
  .day-stat { font-size: 12px; color: #8892b0; }
  .day-stat span { color: #e8e8e8; font-weight: 600; }

  /* ---- 餐卡片 ---- */
  .meal {
    background: rgba(255,255,255,0.03);
    border-radius: 14px;
    margin-bottom: 10px;
    border-left: 3px solid;
    overflow: hidden;
  }
  .meal-breakfast { border-left-color: #f39c12; }
  .meal-snack { border-left-color: #9b59b6; }
  .meal-lunch { border-left-color: #e74c3c; }
  .meal-pre { border-left-color: #3498db; }
  .meal-post { border-left-color: #00d4aa; }
  .meal-dinner { border-left-color: #1abc9c; }
  .meal-head {
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .meal-name {
    font-size: 13px;
    font-weight: 600;
    color: #8892b0;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .meal-items {
    font-size: 14px;
    line-height: 1.7;
    color: #e8e8e8;
  }
  .meal-summary {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11px;
    color: #8892b0;
    flex-wrap: wrap;
  }
  .meal-summary .ms-num { color: #00d4aa; font-weight: 600; }
  .expand-hint {
    font-size: 10px;
    color: #556;
    margin-top: 4px;
    transition: color 0.2s;
  }
  .meal-head:hover .expand-hint { color: #8892b0; }

  /* ---- 折叠明细表格 ---- */
  .meal-detail {
    background: rgba(0,0,0,0.15);
    padding: 0 16px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, padding 0.35s ease;
  }
  .meal-detail.open {
    max-height: 600px;
    padding: 12px 16px 16px;
  }
  .detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .detail-table th {
    text-align: left;
    color: #8892b0;
    font-weight: 600;
    padding: 4px 6px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    white-space: nowrap;
  }
  .detail-table td {
    padding: 6px;
    color: #c8c8c8;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    white-space: nowrap;
  }
  .detail-table tr:last-child td { border-bottom: none; }
  .detail-table .col-name { white-space: normal; min-width: 100px; }
  .detail-table .col-num { text-align: right; font-variant-numeric: tabular-nums; }
  .detail-table .highlight-protein {
    color: #ff9f43;
    font-weight: 600;
    background: rgba(255,159,67,0.08);
    padding: 1px 6px;
    border-radius: 6px;
  }
  .detail-total td {
    font-weight: 700;
    color: #00d4aa;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 8px;
  }

  /* ---- 底部 & 弹窗 ---- */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(26,26,46,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 12px 16px;
    display: flex;
    justify-content: space-around;
    z-index: 100;
  }
  .bottom-btn {
    font-size: 12px;
    color: #8892b0;
    text-align: center;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 10px;
    transition: all 0.2s;
    user-select: none;
  }
  .bottom-btn.active {
    color: #00d4aa;
    background: rgba(0,212,170,0.1);
  }
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: flex-end;
    z-index: 200;
  }
  .modal {
    background: #1a1a2e;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px 20px 40px;
    animation: slideUp 0.3s ease;
    position: relative;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { font-size: 18px; margin-bottom: 16px; color: #00d4aa; }
  .modal-section { margin-bottom: 16px; }
  .modal-section h4 { font-size: 14px; color: #8892b0; margin-bottom: 8px; }
  .modal-section p, .modal-section li { font-size: 13px; line-height: 1.8; color: #c8c8c8; }
  .modal-section ul { padding-left: 18px; }
  .close-btn {
    position: absolute;
    top: 16px; right: 20px;
    font-size: 24px;
    color: #8892b0;
    cursor: pointer;
    z-index: 10;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .check-item input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: #00d4aa;
    flex-shrink: 0;
  }
  .check-item label { font-size: 14px; flex: 1; color: #e8e8e8; }
  .check-item .qty { font-size: 12px; color: #8892b0; flex-shrink: 0; }
  .highlight-protein {
    color: #ff9f43;
    font-weight: 600;
    background: rgba(255,159,67,0.08);
    padding: 1px 6px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<div x-data="mealPlan">

  <!-- 顶部标题 -->
  <div class="header">
    <h1>💪 健身腹肌餐计划</h1>
    <div class="sub" x-text="profile"></div>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-bar">
    <template x-for="s in summaryStats" :key="s.label">
      <div class="stat-card">
        <div class="num" x-text="s.value"></div>
        <div class="label" x-text="s.label"></div>
      </div>
    </template>
  </div>

  <!-- 星期标签页 -->
  <div class="tabs">
    <template x-for="(day, i) in days" :key="i">
      <div class="tab" :class="{ active: activeDay === i }" @click="activeDay = i" x-text="day.shortName"></div>
    </template>
  </div>

  <!-- 当天餐单 -->
  <div class="content">
    <div class="day-card">
      <div class="day-header">
        <div class="day-title" x-text="currentDay.title"></div>
        <div class="day-tag" :class="currentDay.tagClass" x-text="currentDay.tag"></div>
      </div>
      <div class="day-stats">
        <template x-for="st in currentDayStats" :key="st.label">
          <div class="day-stat"><span x-text="st.icon"></span> <span x-text="st.value"></span> <span x-text="st.label"></span></div>
        </template>
      </div>

      <!-- 每餐 -->
      <template x-for="(meal, mi) in currentDay.meals" :key="mi">
        <div class="meal" :class="'meal-' + meal.type">
          <!-- 可点击的头部：餐名 + 食物列表 + 本餐合计 -->
          <div class="meal-head" @click="toggleDetail($event, mi)" :style="hasMealDetails(meal) ? '' : 'cursor: default;'">
            <div class="meal-name" x-text="meal.name"></div>
            <div class="meal-items" x-html="mealSummaryText(meal)"></div>
            <div class="meal-summary">
              <span>🔥 <span class="ms-num" x-text="formatKcal(mealTotal(meal).kcal)"></span> kcal</span>
              <span>🥩 <span class="ms-num" x-text="formatMacro(mealTotal(meal).protein)"></span> 蛋白</span>
              <span>🍠 <span class="ms-num" x-text="formatMacro(mealTotal(meal).carbs)"></span> 碳水</span>
              <span>🥑 <span class="ms-num" x-text="formatMacro(mealTotal(meal).fat)"></span> 脂肪</span>
            </div>
            <div class="expand-hint" x-show="hasMealDetails(meal)" x-text="isDetailOpen(mi) ? '▲ 收起' : '▼ 点击查看食物明细'"></div>
          </div>

          <!-- 折叠明细表格 -->
          <div class="meal-detail" x-show="hasMealDetails(meal)" :class="{ open: isDetailOpen(mi) }">
            <table class="detail-table">
              <thead>
                <tr>
                  <th class="col-name">食物</th>
                  <th class="col-num">热量</th>
                  <th class="col-num">蛋白质</th>
                  <th class="col-num">碳水</th>
                  <th class="col-num">脂肪</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(food, fi) in mealDetailRows(meal)" :key="fi">
                  <tr>
                    <td class="col-name" x-html="food.name"></td>
                    <td class="col-num" x-text="food.kcal + ' kcal'"></td>
                    <td class="col-num" x-text="food.protein + 'g'"></td>
                    <td class="col-num" x-text="food.carbs + 'g'"></td>
                    <td class="col-num" x-text="food.fat + 'g'"></td>
                  </tr>
                </template>
              </tbody>
              <tfoot>
                <tr class="detail-total">
                  <td>本餐合计</td>
                  <td class="col-num" x-text="formatKcal(mealTotal(meal).kcal) + ' kcal'"></td>
                  <td class="col-num" x-text="formatMacro(mealTotal(meal).protein) + 'g'"></td>
                  <td class="col-num" x-text="formatMacro(mealTotal(meal).carbs) + 'g'"></td>
                  <td class="col-num" x-text="formatMacro(mealTotal(meal).fat) + 'g'"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-bar">
    <div class="bottom-btn" :class="{ active: activePage === 'plan' }" @click="activePage = 'plan'">📋 餐单</div>
    <div class="bottom-btn" :class="{ active: activePage === 'shop' }" @click="activePage = 'shop'">🛒 采购</div>
    <div class="bottom-btn" :class="{ active: activePage === 'tips' }" @click="activePage = 'tips'">💡 贴士</div>
  </div>

  <!-- 采购清单弹窗 -->
  <div class="modal-overlay" x-show="activePage === 'shop'" x-transition @click.self="activePage = 'plan'">
    <div class="modal" @click.stop>
      <div class="close-btn" @click="activePage = 'plan'">✕</div>
      <h3>🛒 一周采购清单</h3>
      <template x-for="section in shopList" :key="section.title">
        <div class="modal-section">
          <h4 x-text="section.title"></h4>
          <template x-for="(item, idx) in section.items" :key="section.title + idx">
            <div class="check-item">
              <input type="checkbox" :id="'shop_' + section.key + idx" x-model="item.checked"
                     @change="saveShopState()">
              <label :for="'shop_' + section.key + idx" x-html="item.name"></label>
              <span class="qty" x-text="item.qty"></span>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>

  <!-- 贴士弹窗 -->
  <div class="modal-overlay" x-show="activePage === 'tips'" x-transition @click.self="activePage = 'plan'">
    <div class="modal" @click.stop>
      <div class="close-btn" @click="activePage = 'plan'">✕</div>
      <h3>💡 执行贴士</h3>
      <template x-for="tip in tips" :key="tip.title">
        <div class="modal-section">
          <h4 x-text="tip.title"></h4>
          <div x-html="tip.content"></div>
        </div>
      </template>
    </div>
  </div>

</div>

<script>
// 28岁 · 男 · 165cm · 62kg · 目标：六块腹肌 目前卧推单边 15kg 做组，引体拉 8 个，周一练胸，周二背，周三腿，周四练肩
document.addEventListener('alpine:init', () => {
  Alpine.data('mealPlan', () => ({
    profile: '28岁 · 男 · 165cm · 62kg · 目标：六块腹肌 · 极速执行版',
    bodyWeightKg: 62,
    maintenanceCalories: 2195,
    activeDay: 0,
    activePage: 'plan',
    openMeals: {},

    foodBases: {
      corn: { name: '玉米（真空包装）', basis: '每根（约200g）', baseAmount: 200, unit: 'g', kcal: 212, protein: 6.6, carbs: 41.4, fat: 2.4 },
      wholeEgg: { name: '全蛋', basis: '每1个', baseAmount: 1, unit: '个', kcal: 72, protein: 6.3, carbs: 0.6, fat: 5 },
      highProteinMilk: { name: '高蛋白低脂奶', basis: '每100ml', baseAmount: 100, unit: 'ml', kcal: 36, protein: 4.2, carbs: 2.8, fat: 0.8 },
      pasteurizedWholeMilk: { name: '鲜牛奶（巴氏全脂）', basis: '每100ml', baseAmount: 100, unit: 'ml', kcal: 67, protein: 3.3, carbs: 4.8, fat: 3.9 },
      filetSteakRaw: { name: '菲力牛排（生）', basis: '每100g', baseAmount: 100, unit: 'g', kcal: 130, protein: 21, carbs: 0, fat: 5 },
      oysterBladeSteak: { name: '板腱牛排（生）', basis: '每100g', baseAmount: 100, unit: 'g', kcal: 140, protein: 20.5, carbs: 0, fat: 5.5 },
      chickenBreastRaw: { name: '鸡胸肉（生）', basis: '每100g', baseAmount: 100, unit: 'g', kcal: 120, protein: 23, carbs: 0, fat: 2.6 },
      chickenThighRaw: { name: '去皮鸡腿（生）', basis: '每100g', baseAmount: 100, unit: 'g', kcal: 145, protein: 19, carbs: 0, fat: 8 },
      sweetPotato: { name: '红薯（生）', basis: '每100g', baseAmount: 100, unit: 'g', kcal: 86, protein: 1.6, carbs: 20.1, fat: 0.1 },
      cucumber: { name: '黄瓜条', basis: '每100g', baseAmount: 100, unit: 'g', kcal: 15, protein: 0.8, carbs: 2.9, fat: 0.2 },
      whiteMushroom: { name: '白蘑菇（生）', basis: '每100g', baseAmount: 100, unit: 'g', kcal: 22, protein: 3.1, carbs: 3.3, fat: 0.3 },
      banana: { name: '香蕉（可食部）', basis: '每100g', baseAmount: 100, unit: 'g', kcal: 89, protein: 1.1, carbs: 22.8, fat: 0.3 },
      whey: { name: '蛋白粉', basis: '每31g（约1勺）', baseAmount: 31, unit: 'g', kcal: 120, protein: 24, carbs: 4, fat: 1.5 },
      almonds: { name: '巴旦木（杏仁）', basis: '每10g', baseAmount: 10, unit: 'g', kcal: 58, protein: 2.1, carbs: 2.0, fat: 5.0 },
      camelliaOil: { name: '山茶油（烹饪）', basis: '每5ml（1茶匙）', baseAmount: 5, unit: 'ml', kcal: 45, protein: 0, carbs: 0, fat: 5 },
      butter: { name: '黄油（烹饪）', basis: '每10g', baseAmount: 10, unit: 'g', kcal: 72, protein: 0.1, carbs: 0, fat: 8.1 },
    },
    toggleDetail(_e, mi) {
      const meal = this.currentDay.meals[mi];
      if (!this.hasMealDetails(meal)) return;
      this.openMeals[mi] = !this.openMeals[mi];
    },
    isDetailOpen(mi) {
      return !!this.openMeals[mi];
    },
    hasMealDetails(meal) {
      return Array.isArray(meal.items) && meal.items.length > 0;
    },

    get currentDay() {
      return this.days[this.activeDay];
    },

    get currentDayStats() {
      return this.dayStats(this.currentDay);
    },

    get summaryStats() {
      const avg = this.averageDayTotals();
      return [
        { value: this.formatKcal(avg.kcal), label: '日均热量' },
        { value: this.formatMacro(avg.protein) + 'g', label: '日均蛋白质' },
        { value: (avg.protein / this.bodyWeightKg).toFixed(2) + 'g', label: '蛋白质/kg' },
        { value: this.formatKcal(this.maintenanceCalories - avg.kcal), label: '热量缺口' },
      ];
    },

    calcFood(item) {
      const base = this.foodBases[item.foodKey];
      const ratio = item.amount / base.baseAmount;
      return {
        kcal: base.kcal * ratio,
        protein: base.protein * ratio,
        carbs: base.carbs * ratio,
        fat: base.fat * ratio,
      };
    },

    mealTotal(meal) {
      return (meal.items || []).reduce((sum, item) => {
        const values = this.calcFood(item);
        sum.kcal += values.kcal;
        sum.protein += values.protein;
        sum.carbs += values.carbs;
        sum.fat += values.fat;
        return sum;
      }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
    },

    dayTotal(day) {
      return day.meals.reduce((sum, meal) => {
        const totals = this.mealTotal(meal);
        sum.kcal += totals.kcal;
        sum.protein += totals.protein;
        sum.carbs += totals.carbs;
        sum.fat += totals.fat;
        return sum;
      }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
    },

    averageDayTotals() {
      const totals = this.days.reduce((sum, day) => {
        const dayTotals = this.dayTotal(day);
        sum.kcal += dayTotals.kcal;
        sum.protein += dayTotals.protein;
        sum.carbs += dayTotals.carbs;
        sum.fat += dayTotals.fat;
        return sum;
      }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
      return {
        kcal: totals.kcal / this.days.length,
        protein: totals.protein / this.days.length,
        carbs: totals.carbs / this.days.length,
        fat: totals.fat / this.days.length,
      };
    },

    dayStats(day) {
      const total = this.dayTotal(day);
      return [
        { icon: '🔥', value: this.formatKcal(total.kcal), label: 'kcal' },
        { icon: '🥩', value: this.formatMacro(total.protein) + 'g', label: '蛋白质' },
        { icon: '🍠', value: this.formatMacro(total.carbs) + 'g', label: '碳水' },
        { icon: '🥑', value: this.formatMacro(total.fat) + 'g', label: '脂肪' },
      ];
    },

    formatKcal(value) {
      return String(Math.round(value));
    },

    formatMacro(value) {
      const rounded = Number(value.toFixed(1));
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    },

    mealSummaryText(meal) {
      if (meal.note) return meal.note;
      return meal.items.map(item => item.summaryText).join('｜');
    },

    mealDetailRows(meal) {
      return (meal.items || []).map(item => {
        const base = this.foodBases[item.foodKey];
        const values = this.calcFood(item);
        const displayName = `${base.name} ${item.amountText || `${item.amount}${base.unit}`}`;
        const name = item.highlight
          ? `<span class="highlight-protein">${displayName}</span>`
          : displayName;
        return {
          name,
          kcal: this.formatKcal(values.kcal),
          protein: this.formatMacro(values.protein),
          carbs: this.formatMacro(values.carbs),
          fat: this.formatMacro(values.fat),
        };
      });
    },

          <li>红薯：餐单上的克数就是生重，周末按份称好生重再整块蒸熟，上班直接带（蒸后重量基本不变）</li>
          <li>黄瓜：周末洗好切条分盒，午餐抓一盒就走</li>
          <li>鸡蛋：周末煮 21 个，早餐直接配玉米和高蛋白低脂奶</li>
          <li>蛋白粉：已移除，蛋白质全部从鸡蛋、板腱牛排、牛奶中获取</li>
        </ul>`,
      },
      {
        title: '⚡ 2 周后观察',
        content: `<p>每周掉 >0.7kg、训练发软或没劲 → 周一到周四晚餐红薯各加 50g</p>
          <p>体重和腰围 2 周都不动 → 先把周五到周日晚餐红薯各减 50g，别先砍肉</p>`,
      },
    ],

    init() {
      const dayOfWeek = new Date().getDay();
      this.activeDay = dayOfWeek === 0 ? 6 : dayOfWeek - 1;

      this.shopList.forEach(section => {
        section.items.forEach((item, idx) => {
          const key = 'shop_' + section.key + idx;
          try { item.checked = localStorage.getItem(key) === 'true'; } catch (e) {}
        });
      });

      // 暴露到全局，方便控制台调用
      window.mealPlan = this;
      // 页面加载后自动输出营养分析到控制台
      this.logAnalysis();
    },

    // ---- 营养分析（对应 calc_nutrition.py L123-153） ----
    generateAnalysis() {
      const w = this.bodyWeightKg;
      const maintain = this.maintenanceCalories;
      const dayTotals = this.days.map(d => this.dayTotal(d));
      const n = dayTotals.length;

      // 每日汇总
      const dayRows = dayTotals.map((t, i) => {
        const c = t.kcal, p = t.protein, cb = t.carbs, f = t.fat;
        return {
          label: this.days[i].title,
          kcal: c, protein: p, carbs: cb, fat: f,
          pPerKg: p / w, fPerKg: f / w,
          surplus: c - maintain,
          pPct: p * 4 / c * 100,
          cPct: cb * 4 / c * 100,
          fPct: f * 9 / c * 100,
        };
      });

      // 7日平均
      const avg = this.averageDayTotals();
      const avgC = avg.kcal, avgP = avg.protein, avgCb = avg.carbs, avgF = avg.fat;

      // 训练日 (Mon-Thu, index 0-3) vs 休息日 (Fri-Sun, index 4-6)
      const trainIdx = [0, 1, 2, 3];
      const restIdx = [4, 5, 6];
      const trainCals = trainIdx.reduce((s, i) => s + dayTotals[i].kcal, 0) / trainIdx.length;
      const restCals = restIdx.reduce((s, i) => s + dayTotals[i].kcal, 0) / restIdx.length;
      const trainPros = trainIdx.reduce((s, i) => s + dayTotals[i].protein, 0) / trainIdx.length;
      const restPros = restIdx.reduce((s, i) => s + dayTotals[i].protein, 0) / restIdx.length;

      // 蛋白质评估
      const pRange = dayTotals.map(t => t.protein);
      const pPerKgRange = pRange.map(p => p / w);
      const inRange = dayTotals.every(t => t.protein / w >= 1.6 && t.protein / w <= 2.4);

      // 脂肪范围
      const fRange = dayTotals.map(t => t.fat);

      // 热量盈余
      const totalSurplus = dayTotals.reduce((s, t) => s + (t.kcal - maintain), 0);

      return {
        dayRows,
        avg: { kcal: avgC, protein: avgP, carbs: avgCb, fat: avgF, pPerKg: avgP / w, fPerKg: avgF / w },
        training: { avgCals: trainCals, avgProtein: trainPros },
        rest: { avgCals: restCals, avgProtein: restPros },
        protein: {
          min: Math.min(...pRange), max: Math.max(...pRange),
          minPerKg: Math.min(...pPerKgRange), maxPerKg: Math.max(...pPerKgRange),
          avg: avgP, avgPerKg: avgP / w, inRange,
        },
        fat: {
          min: Math.min(...fRange), max: Math.max(...fRange),
          minPerKg: Math.min(...fRange) / w, maxPerKg: Math.max(...fRange) / w,
          avg: avgF, avgPerKg: avgF / w,
        },
        macro: { pPct: avgP * 4 / avgC * 100, cPct: avgCb * 4 / avgC * 100, fPct: avgF * 9 / avgC * 100 },
        surplus: { total: totalSurplus, daily: totalSurplus / n, weeklyFatKg: totalSurplus / 7700 },
      };
    },

    logAnalysis() {
      const a = this.generateAnalysis();
      const w = this.bodyWeightKg;
      const maintain = this.maintenanceCalories;

      const hr = '='.repeat(80);
      const hr2 = '-'.repeat(80);
      const f1 = (v, d = 1) => v.toFixed(d);
      const f2 = (v) => v.toFixed(2);

      console.log(`%c${hr}`, 'color: #00d4aa; font-weight: bold;');
      console.log(`%c  📊 七日餐单营养分析报告`, 'color: #00d4aa; font-size: 14px; font-weight: bold;');
      console.log(`%c${hr}`, 'color: #00d4aa; font-weight: bold;');

      // 每日明细
      console.log(`%c\n📋 每日明细:`, 'color: #00a8e8; font-weight: bold;');
      console.log(hr2);
      console.log(`${'日期'.padEnd(14)} ${'热量'.padStart(8)} ${'蛋白质'.padStart(8)} ${'碳水'.padStart(7)} ${'脂肪'.padStart(6)} ${'P/kg'.padStart(7)} ${'盈余'.padStart(9)}`);
      console.log(hr2);
      a.dayRows.forEach(r => {
        console.log(`${r.label.padEnd(14)} ${f1(r.kcal).padStart(8)} ${f1(r.protein).padStart(8)} ${f1(r.carbs).padStart(7)} ${f1(r.fat).padStart(6)} ${f2(r.pPerKg).padStart(5)}g ${('+' + f1(r.surplus)).padStart(9)}`);
      });
      console.log(hr2);
      console.log(`${'七日平均'.padEnd(14)} ${f1(a.avg.kcal).padStart(8)} ${f1(a.avg.protein).padStart(8)} ${f1(a.avg.carbs).padStart(7)} ${f1(a.avg.fat).padStart(6)} ${f2(a.avg.pPerKg).padStart(5)}g ${('+' + f1(a.surplus.daily)).padStart(9)}`);

      // 1. 热量分布
      console.log(`%c\n1. 热量分布`, 'color: #f39c12; font-weight: bold;');
      console.log(`   训练日（周一~周四）平均：  ${f1(a.training.avgCals)} kcal`);
      console.log(`   休息日（周五~周日）平均：  ${f1(a.rest.avgCals)} kcal`);
      console.log(`   训练日 vs 休息日差异：     +${f1(a.training.avgCals - a.rest.avgCals)} kcal`);
      console.log(`   七日范围：                 ${f1(Math.min(...a.dayRows.map(r => r.kcal)))} ~ ${f1(Math.max(...a.dayRows.map(r => r.kcal)))} kcal`);

      // 2. 蛋白质摄入
      console.log(`%c\n2. 蛋白质摄入`, 'color: #f39c12; font-weight: bold;');
      console.log(`   每日范围：                 ${f1(a.protein.min)} ~ ${f1(a.protein.max)} g`);
      console.log(`   每公斤体重范围：           ${f2(a.protein.minPerKg)} ~ ${f2(a.protein.maxPerKg)} g/kg`);
      console.log(`   七日平均：                 ${f1(a.protein.avg)}g（${f2(a.protein.avgPerKg)} g/kg）`);
      console.log(`   推荐范围：                 1.6~2.2 g/kg（${f1(1.6 * w)}~${f1(2.2 * w)}g）`);
      console.log(`   评估：                     ${a.protein.inRange ? '✅ 全部在理想范围内' : '⚠️ 部分超出理想范围'}`);

      // 3. 脂肪摄入
      console.log(`%c\n3. 脂肪摄入`, 'color: #f39c12; font-weight: bold;');
      console.log(`   每日范围：                 ${f1(a.fat.min)} ~ ${f1(a.fat.max)} g`);
      console.log(`   每公斤体重范围：           ${f2(a.fat.minPerKg)} ~ ${f2(a.fat.maxPerKg)} g/kg`);
      console.log(`   七日平均：                 ${f1(a.fat.avg)}g（${f2(a.fat.avgPerKg)} g/kg）`);

      // 4. 宏量营养素比例
      console.log(`%c\n4. 宏量营养素热量占比`, 'color: #f39c12; font-weight: bold;');
      console.log(`   七日平均：                 蛋白:${f1(a.macro.pPct)}% / 碳水:${f1(a.macro.cPct)}% / 脂肪:${f1(a.macro.fPct)}%`);
      console.log(`   减脂/增肌参考：            蛋白:25-30% / 碳水:40-50% / 脂肪:20-30%`);

      // 5. 热量盈余
      console.log(`%c\n5. 热量盈余（维持热量 ${maintain} kcal）`, 'color: #f39c12; font-weight: bold;');
      console.log(`   七日总盈余：               +${f1(a.surplus.total)} kcal`);
      console.log(`   日均盈余：                 +${f1(a.surplus.daily)} kcal`);
      console.log(`   预估每周增脂：             +${f2(a.surplus.weeklyFatKg)} kg（${f1(a.surplus.weeklyFatKg * 1000)}g）`);

      console.log(`%c${hr}`, 'color: #00d4aa; font-weight: bold;');
      console.log(`%c  💡 在控制台调用 mealPlan.generateAnalysis() 可获取原始分析数据`, 'color: #8892b0;');
      console.log(`%c${hr}`, 'color: #00d4aa; font-weight: bold;');
    },

    saveShopState() {
      this.shopList.forEach(section => {
        section.items.forEach((item, idx) => {
          const key = 'shop_' + section.key + idx;
          try { localStorage.setItem(key, item.checked); } catch (e) {}
        });
      });
    },
  }));
});
</script>
