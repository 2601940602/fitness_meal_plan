<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健身腹肌餐计划</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #e8e8e8;
    padding-bottom: 80px;
  }
  .header {
    padding: 24px 20px 16px;
    text-align: center;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, #00d4aa, #00a8e8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .header .sub { font-size: 12px; color: #8892b0; }
  .stats-bar {
    display: flex;
    justify-content: space-around;
    padding: 16px 12px;
    gap: 8px;
  }
  .stat-card {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .stat-card .num { font-size: 20px; font-weight: 700; color: #00d4aa; }
  .stat-card .label { font-size: 11px; color: #8892b0; margin-top: 2px; }
  .tabs {
    display: flex;
    overflow-x: auto;
    padding: 0 16px;
    gap: 8px;
    margin-top: 8px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #8892b0;
    user-select: none;
  }
  .tab.active {
    background: linear-gradient(135deg, #00d4aa, #00a8e8);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(0,212,170,0.3);
  }
  .content { padding: 16px; }
  .day-card {
    background: rgba(255,255,255,0.04);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .day-title { font-size: 18px; font-weight: 700; }
  .day-tag {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 10px;
    font-weight: 600;
  }
  .tag-high { background: rgba(0,212,170,0.15); color: #00d4aa; }
  .tag-mid { background: rgba(0,168,232,0.15); color: #00a8e8; }
  .tag-low { background: rgba(233,69,96,0.15); color: #e94560; }
  .day-stats {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap;
  }
  .day-stat { font-size: 12px; color: #8892b0; }
  .day-stat span { color: #e8e8e8; font-weight: 600; }

  /* ---- 餐卡片 ---- */
  .meal {
    background: rgba(255,255,255,0.03);
    border-radius: 14px;
    margin-bottom: 10px;
    border-left: 3px solid;
    overflow: hidden;
  }
  .meal-breakfast { border-left-color: #f39c12; }
  .meal-snack { border-left-color: #9b59b6; }
  .meal-lunch { border-left-color: #e74c3c; }
  .meal-pre { border-left-color: #3498db; }
  .meal-post { border-left-color: #00d4aa; }
  .meal-dinner { border-left-color: #1abc9c; }
  .meal-head {
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .meal-name {
    font-size: 13px;
    font-weight: 600;
    color: #8892b0;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .meal-items {
    font-size: 14px;
    line-height: 1.7;
    color: #e8e8e8;
  }
  .meal-summary {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11px;
    color: #8892b0;
    flex-wrap: wrap;
  }
  .meal-summary .ms-num { color: #00d4aa; font-weight: 600; }
  .expand-hint {
    font-size: 10px;
    color: #556;
    margin-top: 4px;
    transition: color 0.2s;
  }
  .meal-head:hover .expand-hint { color: #8892b0; }

  /* ---- 折叠明细表格 ---- */
  .meal-detail {
    background: rgba(0,0,0,0.15);
    padding: 0 16px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, padding 0.35s ease;
  }
  .meal-detail.open {
    max-height: 600px;
    padding: 12px 16px 16px;
  }
  .detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .detail-table th {
    text-align: left;
    color: #8892b0;
    font-weight: 600;
    padding: 4px 6px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    white-space: nowrap;
  }
  .detail-table td {
    padding: 6px;
    color: #c8c8c8;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    white-space: nowrap;
  }
  .detail-table tr:last-child td { border-bottom: none; }
  .detail-table .col-name { white-space: normal; min-width: 100px; }
  .detail-table .col-num { text-align: right; font-variant-numeric: tabular-nums; }
  .detail-table .highlight-protein {
    color: #ff9f43;
    font-weight: 600;
    background: rgba(255,159,67,0.08);
    padding: 1px 6px;
    border-radius: 6px;
  }
  .detail-total td {
    font-weight: 700;
    color: #00d4aa;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 8px;
  }

  /* ---- 底部 & 弹窗 ---- */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(26,26,46,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 12px 16px;
    display: flex;
    justify-content: space-around;
    z-index: 100;
  }
  .bottom-btn {
    font-size: 12px;
    color: #8892b0;
    text-align: center;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 10px;
    transition: all 0.2s;
    user-select: none;
  }
  .bottom-btn.active {
    color: #00d4aa;
    background: rgba(0,212,170,0.1);
  }
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: flex-end;
    z-index: 200;
  }
  .modal {
    background: #1a1a2e;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px 20px 40px;
    animation: slideUp 0.3s ease;
    position: relative;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { font-size: 18px; margin-bottom: 16px; color: #00d4aa; }
  .modal-section { margin-bottom: 16px; }
  .modal-section h4 { font-size: 14px; color: #8892b0; margin-bottom: 8px; }
  .modal-section p, .modal-section li { font-size: 13px; line-height: 1.8; color: #c8c8c8; }
  .modal-section ul { padding-left: 18px; }
  .close-btn {
    position: absolute;
    top: 16px; right: 20px;
    font-size: 24px;
    color: #8892b0;
    cursor: pointer;
    z-index: 10;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .check-item input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: #00d4aa;
    flex-shrink: 0;
  }
  .check-item label { font-size: 14px; flex: 1; color: #e8e8e8; }
  .check-item .qty { font-size: 12px; color: #8892b0; flex-shrink: 0; }
  .highlight-protein {
    color: #ff9f43;
    font-weight: 600;
    background: rgba(255,159,67,0.08);
    padding: 1px 6px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<div x-data="mealPlan">

  <!-- 顶部标题 -->
  <div class="header">
    <h1>💪 健身腹肌餐计划</h1>
    <div class="sub" x-text="profile"></div>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-bar">
    <template x-for="s in summaryStats" :key="s.label">
      <div class="stat-card">
        <div class="num" x-text="s.value"></div>
        <div class="label" x-text="s.label"></div>
      </div>
    </template>
  </div>

  <!-- 星期标签页 -->
  <div class="tabs">
    <template x-for="(day, i) in days" :key="i">
      <div class="tab" :class="{ active: activeDay === i }" @click="activeDay = i" x-text="day.shortName"></div>
    </template>
  </div>

  <!-- 当天餐单 -->
  <div class="content">
    <div class="day-card">
      <div class="day-header">
        <div class="day-title" x-text="currentDay.title"></div>
        <div class="day-tag" :class="currentDay.tagClass" x-text="currentDay.tag"></div>
      </div>
      <div class="day-stats">
        <template x-for="st in currentDay.stats" :key="st.label">
          <div class="day-stat"><span x-text="st.icon"></span> <span x-text="st.value"></span> <span x-text="st.label"></span></div>
        </template>
      </div>

      <!-- 每餐 -->
      <template x-for="(meal, mi) in currentDay.meals" :key="mi">
        <div class="meal" :class="'meal-' + meal.type">
          <!-- 可点击的头部：餐名 + 食物列表 + 本餐合计 -->
          <div class="meal-head" @click="toggleDetail($event, mi)">
            <div class="meal-name" x-text="meal.name"></div>
            <div class="meal-items" x-html="meal.summary"></div>
            <div class="meal-summary">
              <span>🔥 <span class="ms-num" x-text="meal.total.kcal"></span> kcal</span>
              <span>🥩 <span class="ms-num" x-text="meal.total.protein + 'g'"></span> 蛋白</span>
              <span>🍠 <span class="ms-num" x-text="meal.total.carbs + 'g'"></span> 碳水</span>
              <span>🥑 <span class="ms-num" x-text="meal.total.fat + 'g'"></span> 脂肪</span>
            </div>
            <div class="expand-hint" x-text="isDetailOpen(mi) ? '▲ 收起' : '▼ 点击查看食物明细'"></div>
          </div>

          <!-- 折叠明细表格 -->
          <div class="meal-detail" :class="{ open: isDetailOpen(mi) }">
            <table class="detail-table">
              <thead>
                <tr>
                  <th class="col-name">食物</th>
                  <th class="col-num">热量</th>
                  <th class="col-num">蛋白质</th>
                  <th class="col-num">碳水</th>
                  <th class="col-num">脂肪</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(food, fi) in meal.foods" :key="fi">
                  <tr>
                    <td class="col-name" x-html="food.name"></td>
                    <td class="col-num" x-text="food.kcal + ' kcal'"></td>
                    <td class="col-num" x-text="food.protein + 'g'"></td>
                    <td class="col-num" x-text="food.carbs + 'g'"></td>
                    <td class="col-num" x-text="food.fat + 'g'"></td>
                  </tr>
                </template>
              </tbody>
              <tfoot>
                <tr class="detail-total">
                  <td>本餐合计</td>
                  <td class="col-num" x-text="meal.total.kcal + ' kcal'"></td>
                  <td class="col-num" x-text="meal.total.protein + 'g'"></td>
                  <td class="col-num" x-text="meal.total.carbs + 'g'"></td>
                  <td class="col-num" x-text="meal.total.fat + 'g'"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-bar">
    <div class="bottom-btn" :class="{ active: activePage === 'plan' }" @click="activePage = 'plan'">📋 餐单</div>
    <div class="bottom-btn" :class="{ active: activePage === 'shop' }" @click="activePage = 'shop'">🛒 采购</div>
    <div class="bottom-btn" :class="{ active: activePage === 'tips' }" @click="activePage = 'tips'">💡 贴士</div>
  </div>

  <!-- 采购清单弹窗 -->
  <div class="modal-overlay" x-show="activePage === 'shop'" x-transition @click.self="activePage = 'plan'">
    <div class="modal" @click.stop>
      <div class="close-btn" @click="activePage = 'plan'">✕</div>
      <h3>🛒 一周采购清单</h3>
      <template x-for="section in shopList" :key="section.title">
        <div class="modal-section">
          <h4 x-text="section.title"></h4>
          <template x-for="(item, idx) in section.items" :key="section.title + idx">
            <div class="check-item">
              <input type="checkbox" :id="'shop_' + section.key + idx" x-model="item.checked"
                     @change="saveShopState()">
              <label :for="'shop_' + section.key + idx" x-html="item.name"></label>
              <span class="qty" x-text="item.qty"></span>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>

  <!-- 贴士弹窗 -->
  <div class="modal-overlay" x-show="activePage === 'tips'" x-transition @click.self="activePage = 'plan'">
    <div class="modal" @click.stop>
      <div class="close-btn" @click="activePage = 'plan'">✕</div>
      <h3>💡 执行贴士</h3>
      <template x-for="tip in tips" :key="tip.title">
        <div class="modal-section">
          <h4 x-text="tip.title"></h4>
          <div x-html="tip.content"></div>
        </div>
      </template>
    </div>
  </div>

</div>
