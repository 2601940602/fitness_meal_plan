<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧮 备料计算 - 健身腹肌餐计划</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="meal-data.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [x-cloak] { display: none !important; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #e8e8e8;
    color-scheme: dark;
    padding-bottom: 100px;
  }
  .header {
    padding: 24px 20px 16px;
    text-align: center;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, #00d4aa, #00a8e8);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .header .sub { font-size: 12px; color: #8892b0; }
  .content { padding: 16px; max-width: 720px; margin: 0 auto; }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 18px 16px;
    margin-bottom: 14px;
  }
  .card h3 {
    font-size: 15px;
    font-weight: 700;
    color: #00d4aa;
    margin-bottom: 12px;
  }
  .hint { font-size: 12px; color: #8892b0; line-height: 1.7; }
  .hl { color: #00d4aa; font-weight: 600; }

  /* 连续区间 */
  .range-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  input[type="number"], input[type="text"] {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8e8e8;
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 14px;
    outline: none;
    min-width: 0;
    width: 100%;
  }
  input:focus { border-color: #00d4aa; }
  ::placeholder { color: #5a6480; }

  /* 自绘下拉：弹层宽度严格跟随触发器，永不超出屏幕 */
  .dd { position: relative; flex: 1; min-width: 0; }
  .dd-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8e8e8;
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
  }
  .dd-btn:disabled { opacity: 0.5; cursor: default; }
  .dd-btn .dd-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-btn .dd-label.placeholder { color: #5a6480; }
  .dd-arrow { flex-shrink: 0; color: #8892b0; font-size: 10px; transition: transform 0.2s; }
  .dd.open .dd-arrow { transform: rotate(180deg); }
  .dd-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    max-height: 300px;
    overflow-y: auto;
    background: #16213e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 6px;
    z-index: 200;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
  }
  .dd-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #e8e8e8;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dd-item:hover, .dd-item:focus { background: rgba(0,212,170,0.15); outline: none; }
  .dd-item.active { background: rgba(0,212,170,0.25); color: #ffffff; }
  .dd-empty { padding: 10px; font-size: 13px; color: #5a6480; text-align: center; }

  .quick-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .mini-btn {
    padding: 7px 14px;
    font-size: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #b8c0d9;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mini-btn:active { transform: scale(0.96); }

  /* 食材选择行 */
  .ing-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .ing-row:first-child { padding-top: 0; }
  .ing-check { width: 18px; height: 18px; accent-color: #00d4aa; flex-shrink: 0; }
  .ing-icon { font-size: 18px; flex-shrink: 0; }
  .ing-name { flex: 1 1 140px; font-size: 14px; }
  .ing-hint { font-size: 12px; color: #8892b0; white-space: nowrap; }
  .ing-row.on .ing-name { color: #00d4aa; font-weight: 600; }
  .ing-row.on .ing-hint { color: #b8c0d9; }
  .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .cell-note { font-size: 11px; color: #8892b0; font-weight: 400; margin-top: 2px; white-space: normal; }

  .error-msg { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; min-height: 18px; }

  /* 结果 */
  .summary-line { font-size: 13px; color: #b8c0d9; line-height: 1.8; }
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    margin-top: 10px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    padding: 10px 8px;
    text-align: right;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  th { white-space: normal; }
  td { white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { background: rgba(255,255,255,0.05); color: #8892b0; font-weight: 600; font-size: 12px; }
  tbody tr:last-child td { border-bottom: none; }
  td.total { color: #00d4aa; font-weight: 700; }
  .sub-title { font-size: 13px; font-weight: 700; color: #b8c0d9; margin-top: 18px; }
  .export-row { display: flex; gap: 10px; margin-top: 14px; }
  .export-row .mini-btn { flex: 1; padding: 10px; font-size: 13px; }

  /* 底部导航 */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(26,26,46,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 12px 16px;
    display: flex;
    justify-content: space-around;
    z-index: 100;
  }
  .bottom-btn {
    font-size: 12px;
    color: #8892b0;
    text-align: center;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 10px;
    transition: all 0.2s;
    user-select: none;
    text-decoration: none;
  }
  .bottom-btn.active {
    color: #00d4aa;
    background: rgba(0,212,170,0.1);
  }

  /* 打印：仅输出结果 */
  @media print {
    body { background: #fff !important; color: #000 !important; color-scheme: light !important; padding: 0 !important; }
    .no-print { display: none !important; }
    .header { position: static; background: none; border: none; padding: 0 0 12px; }
    .header h1 { background: none; -webkit-text-fill-color: #000; color: #000; }
    .header .sub { color: #555; }
    .content { padding: 0; max-width: none; }
    .card { background: #fff !important; border: 1px solid #ccc !important; color: #000 !important; page-break-inside: avoid; }
    .card h3 { color: #000 !important; }
    .summary-line, .hint, .sub-title { color: #333 !important; }
    .cell-note { color: #555 !important; }
    .hl { color: #000 !important; }
    .table-wrap { border-color: #ccc !important; overflow: visible !important; }
    table { min-width: 0 !important; }
    th { background: #f2f2f2 !important; color: #333 !important; }
    th, td { border-color: #ccc !important; color: #000 !important; }
    td.total { color: #000 !important; font-weight: 700; }
  }
</style>
</head>
<body>

<div x-data="prepPage" x-cloak>

  <div class="header">
    <h1>🧮 餐饮备料计算</h1>
    <div class="sub">选时间范围 · 添加食材 · 直接汇总餐单重量</div>
  </div>

  <div class="content">

    <!-- 时间范围 -->
    <div class="card no-print">
      <h3>📅 选择时间范围</h3>
      <div class="range-row">
        <div class="dd" x-data="{ open: false }" :class="{ open: open }" @click.outside="open = false" @keydown.escape.window="open = false">
          <button type="button" class="dd-btn" @click="open = !open" :aria-expanded="open" aria-label="开始日">
            <span class="dd-label" x-text="dayNames[rangeStart]"></span>
            <span class="dd-arrow">▼</span>
          </button>
          <div class="dd-menu" x-show="open">
            <template x-for="(d, i) in dayNames" :key="'s' + i">
              <button type="button" class="dd-item" :class="{ active: rangeStart === i }" @click="rangeStart = i; open = false" x-text="d"></button>
            </template>
          </div>
        </div>
        <span class="hint">至</span>
        <div class="dd" x-data="{ open: false }" :class="{ open: open }" @click.outside="open = false" @keydown.escape.window="open = false">
          <button type="button" class="dd-btn" @click="open = !open" :aria-expanded="open" aria-label="结束日">
            <span class="dd-label" x-text="dayNames[rangeEnd]"></span>
            <span class="dd-arrow">▼</span>
          </button>
          <div class="dd-menu" x-show="open">
            <template x-for="(d, i) in dayNames" :key="'e' + i">
              <button type="button" class="dd-item" :class="{ active: rangeEnd === i }" @click="rangeEnd = i; open = false" x-text="d"></button>
            </template>
          </div>
        </div>
      </div>
      <div class="quick-row">
        <button type="button" class="mini-btn" @click="setRange(0, 4)">工作日</button>
        <button type="button" class="mini-btn" @click="setRange(0, 6)">全周</button>
        <button type="button" class="mini-btn" @click="setRange(5, 6)">周末</button>
      </div>
      <div class="hint" style="margin-top: 10px">已覆盖：<span class="hl" x-text="rangePreview"></span>；开始日晚于结束日时按跨周连续区间计算</div>
    </div>

    <!-- 食材选择 -->
    <div class="card no-print">
      <h3>🥘 选择要计算的食材</h3>
      <div class="add-row">
        <div class="dd" x-data="{ open: false }" :class="{ open: open }" @click.outside="open = false" @keydown.escape.window="open = false">
          <button type="button" class="dd-btn" @click="open = !open" :aria-expanded="open" aria-label="添加食材" :disabled="!availableIngredients.length">
            <span class="dd-label placeholder">选择食材添加…</span>
            <span class="dd-arrow">▼</span>
          </button>
          <div class="dd-menu" x-show="open">
            <template x-for="g in availableIngredients" :key="g.key">
              <button type="button" class="dd-item" @click="addIngredient(g.key); open = false">
                <span x-text="g.icon"></span><span x-text="g.name"></span>
              </button>
            </template>
            <div class="dd-empty" x-show="!availableIngredients.length">已添加全部食材</div>
          </div>
        </div>
      </div>
      <template x-for="g in selected" :key="g.key">
        <div class="ing-row on">
          <span class="ing-icon" x-text="g.icon"></span>
          <span class="ing-name" x-text="g.name"></span>
          <span class="ing-hint" x-text="ingredientHint(g)"></span>
          <button type="button" class="del-btn" @click="removeIngredient(g.key)" :aria-label="'移除' + g.name">✕</button>
        </div>
      </template>
      <div class="hint" style="margin-top: 10px">用量直接来自餐单页（index.html）「当日备料」的食材重量；默认红薯＋土豆，下拉可继续添加</div>
    </div>

    <div class="error-msg no-print" x-show="errorMsg" x-text="errorMsg"></div>

      <!-- 结果 -->
      <div class="card result-card" x-show="result">
      <div class="summary-line">📅 日期区间：<strong class="hl" x-text="result && result.label"></strong>（<span x-text="result ? result.dayIndexes.length : 0"></span> 天）· 🥘 统计食材：<span x-text="result ? result.rows.length : 0"></span> 种</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <template x-for="row in (result ? result.rows : [])" :key="'h' + row.key">
                <th><span x-text="row.icon"></span> <span x-text="row.name"></span></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="col in splitRows" :key="'r' + col.di + col.part">
              <tr>
                <td x-text="col.label"></td>
                <template x-for="row in (result ? result.rows : [])" :key="row.key + '-' + col.di + col.part">
                  <td x-text="row.perDay[col.di] && row.perDay[col.di][col.part] ? row.perDay[col.di][col.part].text : '—'"></td>
                </template>
              </tr>
            </template>
          </tbody>
          <tfoot>
            <tr>
              <td>合计</td>
              <template x-for="row in (result ? result.rows : [])" :key="'t' + row.key">
                <td class="total">
                  <div x-text="row.totalText"></div>
                  <div class="cell-note" x-show="row.note" x-text="row.note"></div>
                </td>
              </template>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="hint">中午＝午餐、晚上＝晚餐；早餐等其他餐次（如练前香蕉）不拆分，仅计入合计</div>
      <!-- <div class="export-row no-print">
        <button type="button" class="mini-btn" @click="exportCsv()">📥 导出 CSV</button>
        <button type="button" class="mini-btn" @click="printResult()">🖨 打印</button>
      </div> -->
    </div>

  </div>

  <div class="bottom-bar no-print">
    <a class="bottom-btn" href="index.html">📋 餐单</a>
    <a class="bottom-btn" href="shop.html">🛒 采购</a>
    <a class="bottom-btn active" href="prep.html">🧮 备料</a>
    <a class="bottom-btn" href="tips.html">💡 贴士</a>
  </div>

</div>

<script>
/* 纯计算库：直接汇总餐单（meal-data.js / index.html）里的食材重量
   整数毫单位（0.001）累加，保证无浮点精度误差 */
window.PrepCalc = (function () {
  const DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

  /* 食材展示图标 */
  const ICONS = {
    sweetPotato: '🍠', potato: '🥔', corn: '🌽', oats: '🥣', banana: '🍌', kiwi: '🥝', cucumber: '🥒',
    whiteMushroom: '🍄', chickenSteak: '🍗', chickenBreastRaw: '🍗', chickenThighRaw: '🍗', mackerel: '🐟',
    wholeEgg: '🥚', highProteinMilk: '🥛', pasteurizedWholeMilk: '🥛',
    filetSteakRaw: '🥩', oysterBladeSteak: '🥩', whey: '🥤', almonds: '🌰',
    camelliaOil: '🫒', butter: '🧈',
  };

  /* 默认食材：红薯＋土豆 */
  const DEFAULT_KEYS = ['sweetPotato', 'potato'];

  function clampDay(v) {
    const n = Math.round(Number(v));
    return Math.min(6, Math.max(0, isNaN(n) ? 0 : n));
  }

  /* 连续区间（支持跨周：开始日晚于结束日时顺延到下周） */
  function resolveRange(rangeStart, rangeEnd) {
    const s = clampDay(rangeStart);
    const e = clampDay(rangeEnd);
    const idx = [];
    if (s <= e) {
      for (let i = s; i <= e; i++) idx.push(i);
    } else {
      for (let i = s; i <= 6; i++) idx.push(i);
      for (let i = 0; i <= e; i++) idx.push(i);
    }
    return idx;
  }

  function toMilli(v) {
    return Math.round((Number(v) || 0) * 1000);
  }

  /* milli 为 0.001 单位的整数，最多保留 1 位小数展示 */
  function formatQty(milli, unit) {
    return String(Math.round(milli / 100) / 10) + (unit || '');
  }

  /* 餐单中实际用到的食材（按 foodBases 顺序） */
  function ingredientList() {
    const data = window.MealData || {};
    const foodBases = data.foodBases || {};
    const used = new Set();
    (data.userDays || []).forEach(day => {
      (day.meals || []).forEach(meal => {
        (meal.items || []).forEach(item => used.add(item.foodKey));
      });
    });
    return Object.keys(foodBases)
      .filter(k => used.has(k))
      .map(k => ({
        key: k,
        name: foodBases[k].name,
        icon: ICONS[k] || '🍴',
        unit: foodBases[k].unit || 'g',
      }));
  }

  /* 备注：鸡排换算袋数（100g/袋）、红薯土豆换算熟重 */
  function noteOf(key, totalMilli) {
    const data = window.MealData || {};
    const base = (data.foodBases || {})[key] || {};
    const total = totalMilli / 1000;
    const parts = [];
    if (key === 'chickenSteak') parts.push('约 ' + (Math.round(total / 10) / 10) + ' 袋（100g/袋）');
    if (base.cookedRatio) parts.push('熟重约 ' + Math.round(total * base.cookedRatio) + 'g');
    return parts.join(' · ');
  }

  /* 按选中日期汇总所选食材：逐日重量 + 合计 */
  function computeTotals(dayIndexes, selectedKeys) {
    const data = window.MealData || {};
    const foodBases = data.foodBases || {};
    const days = (dayIndexes || []).length;
    const keySet = new Set(selectedKeys || []);
    const byKey = {};
    dayIndexes.forEach(di => {
      const day = (data.userDays || [])[di];
      (day.meals || []).forEach(meal => {
        (meal.items || []).forEach(item => {
          if (!keySet.has(item.foodKey)) return;
          const r = byKey[item.foodKey] || (byKey[item.foodKey] = { perDayMilli: {}, lunchMilli: {}, dinnerMilli: {} });
          r.perDayMilli[di] = (r.perDayMilli[di] || 0) + toMilli(item.amount);
          if (meal.type === 'lunch') r.lunchMilli[di] = (r.lunchMilli[di] || 0) + toMilli(item.amount);
          if (meal.type === 'dinner') r.dinnerMilli[di] = (r.dinnerMilli[di] || 0) + toMilli(item.amount);
        });
      });
    });
    const meta = {};
    ingredientList().forEach(g => { meta[g.key] = g; });
    return (selectedKeys || [])
      .filter(k => byKey[k] && meta[k])
      .map(k => {
        const g = meta[k];
        const rec = byKey[k];
        const perDayMilli = rec.perDayMilli;
        let totalMilli = 0;
        const perDay = {};
        Object.keys(perDayMilli).forEach(di => {
          totalMilli += perDayMilli[di];
          perDay[di] = {
            milli: perDayMilli[di],
            text: formatQty(perDayMilli[di], g.unit),
            lunch: rec.lunchMilli[di] != null ? { milli: rec.lunchMilli[di], text: formatQty(rec.lunchMilli[di], g.unit) } : null,
            dinner: rec.dinnerMilli[di] != null ? { milli: rec.dinnerMilli[di], text: formatQty(rec.dinnerMilli[di], g.unit) } : null,
          };
        });
        return {
          key: g.key,
          name: g.name,
          icon: g.icon,
          unit: g.unit,
          perDay,
          totalMilli,
          totalText: formatQty(totalMilli, g.unit),
          perDayText: formatQty(Math.round(totalMilli / days), g.unit) + '/天',
          note: noteOf(g.key, totalMilli),
        };
      });
  }

  /* 日期区间文案：连续（含跨周）显示 x至y，零散显示 顿号连接 */
  function rangeLabel(dayIndexes) {
    const n = (dayIndexes || []).length;
    if (!n) return '';
    if (n === 1) return DAYS[dayIndexes[0]];
    let contiguous = true;
    for (let i = 0; i < n - 1; i++) {
      if ((dayIndexes[i + 1] - dayIndexes[i] + 7) % 7 !== 1) { contiguous = false; break; }
    }
    if (contiguous) {
      const wrap = dayIndexes[n - 1] < dayIndexes[0];
      return DAYS[dayIndexes[0]] + '至' + DAYS[dayIndexes[n - 1]] + (wrap ? '（跨周）' : '');
    }
    return dayIndexes.map(i => DAYS[i]).join('、');
  }

  function unitSummary(rows) {
    const byUnit = {};
    rows.forEach(r => { byUnit[r.unit || 'g'] = (byUnit[r.unit || 'g'] || 0) + r.totalMilli; });
    return Object.keys(byUnit).map(u => formatQty(byUnit[u], u)).join(' · ');
  }

  function toCsv(result) {
    const esc = v => {
      const s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = [];
    lines.push(['备料计算清单'].map(esc).join(','));
    lines.push(['日期区间', result.label + '（' + result.dayIndexes.length + ' 天）'].map(esc).join(','));
    lines.push(['数据来源', '餐单页（index.html）每日餐单'].map(esc).join(','));
    lines.push('');
    lines.push(['日期'].concat(result.rows.map(r => r.name)).map(esc).join(','));
    result.dayIndexes.forEach(di => {
      [['lunch', '中午'], ['dinner', '晚上']].forEach(pair => {
        const cells = [DAYS[di] + ' ' + pair[1]];
        result.rows.forEach(r => {
          const d = r.perDay[di] || {};
          cells.push(d[pair[0]] ? d[pair[0]].text : '');
        });
        lines.push(cells.map(esc).join(','));
      });
    });
    lines.push(['合计'].concat(result.rows.map(r => r.totalText + (r.note ? '（' + r.note + '）' : ''))).map(esc).join(','));
    return lines.join('\r\n');
  }

  return { DAYS, ICONS, DEFAULT_KEYS, resolveRange, toMilli, formatQty, ingredientList, computeTotals, rangeLabel, unitSummary, toCsv };
})();

document.addEventListener('alpine:init', () => {
  Alpine.data('prepPage', () => ({
    dayNames: window.PrepCalc.DAYS,
    rangeStart: 0,
    rangeEnd: 4,
    selected: [],   /* 已添加的食材（按添加顺序） */

    init() {
      /* 默认：红薯＋土豆 */
      const all = window.PrepCalc.ingredientList();
      this.selected = window.PrepCalc.DEFAULT_KEYS
        .map(k => all.find(g => g.key === k))
        .filter(Boolean);
    },

    get dayIndexes() {
      return window.PrepCalc.resolveRange(this.rangeStart, this.rangeEnd);
    },

    get rangePreview() {
      const idx = this.dayIndexes;
      return idx.length ? idx.map(i => this.dayNames[i]).join('、') + '（' + idx.length + ' 天）' : '';
    },

    get availableIngredients() {
      const chosen = new Set(this.selected.map(g => g.key));
      return window.PrepCalc.ingredientList().filter(g => !chosen.has(g.key));
    },

    get selectedKeys() {
      return this.selected.map(g => g.key);
    },

    /* 明细表行：以周几为纵向维度，每天拆成 中午/晚上 两行 */
    get splitRows() {
      return this.result
        ? this.result.dayIndexes.flatMap(di => [
            { di, part: 'lunch', label: this.dayNames[di] + ' 中午' },
            { di, part: 'dinner', label: this.dayNames[di] + ' 晚上' },
          ])
        : [];
    },

    /* 选好时间范围与食材即自动出结果 */
    get result() {
      const dayIndexes = this.dayIndexes;
      const keys = this.selectedKeys;
      if (!dayIndexes.length || !keys.length) return null;
      const rows = window.PrepCalc.computeTotals(dayIndexes, keys);
      return {
        dayIndexes,
        label: window.PrepCalc.rangeLabel(dayIndexes),
        rows,
        unitSummary: window.PrepCalc.unitSummary(rows),
      };
    },

    get errorMsg() {
      if (!this.dayIndexes.length) return '请至少选择一天';
      if (!this.selectedKeys.length) return '请至少添加一种食材';
      return '';
    },

    /* 食材行右侧：当前范围内的合计预览 */
    ingredientHint(g) {
      const rows = window.PrepCalc.computeTotals(this.dayIndexes, [g.key]);
      return rows.length ? rows[0].totalText : '';
    },

    setRange(s, e) {
      this.rangeStart = s;
      this.rangeEnd = e;
    },

    addIngredient(key) {
      if (!key || this.selected.some(g => g.key === key)) return;
      const g = window.PrepCalc.ingredientList().find(x => x.key === key);
      if (g) this.selected.push(g);
    },

    removeIngredient(key) {
      this.selected = this.selected.filter(g => g.key !== key);
    },

    exportCsv() {
      const result = this.result;
      if (!result) return;
      const csv = window.PrepCalc.toCsv(result);
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '备料清单_' + result.label.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]+/g, '') + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    },

    printResult() {
      window.print();
    },
  }));
});
</script>
</body>
</html>
